# LAX3-340M on FineWeb-Edu, 15B tokens — the memory-geometry arm of the
# LAX series: LAX1's pure KDA model with the recurrent state rebalanced
# from 4 heads x (d_k 128, d_v 256) to 2 x (256 x 512). Same weight
# shapes, same parameter count (343.73M vs 343.77M), 2x the token
# capacity of the linear memory. Batch-paired with LAX1 and with the
# SAX2 15B run: same data, token budget, global batch, seed, optimizer
# recipe and layout, so the delta is the memory geometry (plus the
# widened decay init — see the model recipe's confound note).
#
# COMPARE ON loss_ce against lax1-340M-fwe15B-c9af2f44 (tail5 2.3956),
# the direct pair; sax2-340M-fwe15B-79629bc6 (2.4153) for series context.
#
# But loss_ce is NOT where this is decided. The whole motivation is a
# capacity bound measured on a recall-shaped quantity, and the hybrid /
# linear-attention literature finds LM loss nearly flat across memory
# changes while recall is not. The three eval reads that matter, all in
# vagus-eval after the run:
#   1. MQAR recall probe (trio-340M-f97202d6's task): LAX3 should hold
#      up where LAX1 collapses at 2x context.
#   2. The saturation curve that motivated the run — per-token
#      delta-rule residual vs position (GDNLM.surprise, on the
#      mem-consolidate branch). The prediction is falsifiable and sharp:
#      LAX1's residual is flat past ~128 tokens; LAX3's plateau should
#      move out toward ~256 and sit lower. If it does not, the rank
#      bound is not what binds and the d_k ladder stops here.
#   3. The gate spectrum against the LAX1 baseline: does the widened
#      init leave a wider trained spread, and does the head axis still
#      carry it with only 2 heads?
#
# Layout / optimizer / schedule: LAX1's exactly. 1 node x 4 A100 DDP,
# micro 8 x accum 8, global batch 0.5M tokens, Muon polar-express +
# AdamW at a shared lr 1.75e-3 (rms adjust), WSD (warmup 1%, flat,
# linear cooldown over the last 15%), z-loss 1e-4, wd 0.1, grad clip
# 1.0. No pilot ladder: LAX3 changes neither width nor depth, so the
# SAX1 law and the LAX1 pilot ladder carry over.
#
# Cost: total matmul FLOPs/token 2.136 -> 2.193 G (+2.7%) — the scan is
# 1.77x but only 4.2% of the model. MEMORY is the risk, and unlike the
# hybrid runs there is little headroom: LAX1 OOMs at micro 16 already
# (38 GB, jobs 30066917/18), and the chunkwise scan's per-layer
# activation doubles here, 1.61 -> 3.22 GB at micro 8 / chunk 64. If the
# smoke reports near the ceiling, fall back in this order:
#   batch_size=4 grad_accum_steps=16   (same global batch, pairing kept)
#   chunk_size 128 in the model recipe (chunk-state activation ~ 1/C)

run_name: lax3-340M-fwe15B
model_recipe: ../model/lax3_340M.yaml

data_dir: data/tokenized/fineweb-edu-100BT-mistral32k
data_shards: null          # all 20 shards (16.7B tokens); 15B => 0.9 epoch

context_len: 2048
# 4 GPUs, single node; global batch = 4 * 8 * 8 * 2048 = 0.5M tokens.
# micro 8 / accum 8 (SAX1 ran 16 / 4): KDA at micro 16 OOMs on A100-40GB
# at the first step (38 GB allocated — per-channel gates, conv/l2norm
# intermediates and the kernel's saved chunk states on top of SAX1's
# 40.1 GB-peak footprint; jobs 30066917/18). The loader assigns each
# optimizer step the same global window set for 8x8 and 16x4 (rank-
# interleaved slices of the shuffled order), so the SAX1 batch pairing
# holds; only the micro-batch partition of each step differs.
world_size: 4
batch_size: 8              # per-rank micro-batch
grad_accum_steps: 8
global_batch_tokens: 524288
train_tokens: 15_000_000_000
seed: 42

optimizer_name: muon
optimizer_args:
  lr: 1.75e-3
  momentum: 0.95
  weight_decay: 0.1
  lr_adjust: rms
  ns_coeffs: polar_express
  adamw:
    lr: 1.75e-3
    betas: [0.9, 0.95]
    weight_decay: 0.1

schedule_name: wsd
schedule_args:
  warmup: 0.01             # 150M tokens, same as SAX1/SAX2
  decay: 0.15              # linear cooldown over the last 2.25B tokens (SAX2)
  min_ratio: 0.0

grad_clip: 1.0
z_loss: 1e-4
ce_impl: liger

device: auto
dtype: bfloat16
compile: true
tf32: true

out_root: runs
log_interval: 10
slow_interval: 100
permanent_ckpt_interval: 5000
recent_ckpt_minutes: 30
peak_tflops: 312           # A100 bf16 dense; only feeds the MFU metric
