# LAX3-340M smoke — the fwe15B recipe cut to 60 steps (31M tokens). LAX3
# is LAX1 with 2 heads x (d_k 256, d_v 512) instead of 4 x (128 x 256):
# same weight shapes, 2x the recurrent state. So this smoke has one job
# above the usual — find out whether the doubled state fits.
#
# Gates, in order of what would stop the 15B run:
#   max_mem_gb at micro 8. The chunkwise scan materialises
#   (B, L/C, H, d_k, d_v) per layer, 1.61 -> 3.22 GB, and LAX1 already
#   OOMs at micro 16 (38 GB). Anything near the 40 GB ceiling means
#   batch_size=4 grad_accum_steps=16 (same global batch, so the pairing
#   with LAX1 survives), or chunk_size 128 in the model recipe.
#   tokens_per_s / mfu against LAX1's ~0.20 Mtok/s on the same 4 GPUs.
#   Total FLOPs/token is only +2.7%, so a throughput drop much past that
#   is the kernel at d_k 256, not the arithmetic.
#   The gate probe in the slow metrics: mem_len median/max should start
#   spread over a wider range than LAX1's (widened A/dt init).
#
#   sbatch -J lax3smoke -t 00:30:00 recipe/slurm/raven_lax3_340M.sbatch \
#     recipe/train/lax3_340M_smoke.yaml
# Not an experiment: no registry entry, delete the run dir afterwards.

run_name: lax3-340M-smoke
model_recipe: ../model/lax3_340M.yaml

data_dir: data/tokenized/fineweb-edu-100BT-mistral32k
data_shards: null          # all 20 shards (16.7B tokens); 15B => 0.9 epoch

context_len: 2048
# 4 GPUs, single node; global batch = 4 * 8 * 8 * 2048 = 0.5M tokens.
# micro 8 / accum 8 (SAX1 ran 16 / 4): KDA at micro 16 OOMs on A100-40GB
# at the first step (38 GB allocated — per-channel gates, conv/l2norm
# intermediates and the kernel's saved chunk states on top of SAX1's
# 40.1 GB-peak footprint; jobs 30066917/18). The loader assigns each
# optimizer step the same global window set for 8x8 and 16x4 (rank-
# interleaved slices of the shuffled order), so the SAX1 batch pairing
# holds; only the micro-batch partition of each step differs.
world_size: 4
batch_size: 8              # per-rank micro-batch
grad_accum_steps: 8
global_batch_tokens: 524288
train_tokens: 31_457_280       # 60 steps
seed: 42

optimizer_name: muon
optimizer_args:
  lr: 1.75e-3
  momentum: 0.95
  weight_decay: 0.1
  lr_adjust: rms
  ns_coeffs: polar_express
  adamw:
    lr: 1.75e-3
    betas: [0.9, 0.95]
    weight_decay: 0.1

schedule_name: wsd
schedule_args:
  warmup: 0.5             # 150M tokens, same as SAX1/SAX2
  decay: 0.15              # linear cooldown over the last 2.25B tokens (SAX2)
  min_ratio: 0.0

grad_clip: 1.0
z_loss: 1e-4
ce_impl: liger

device: auto
dtype: bfloat16
compile: true
tf32: true

out_root: runs
log_interval: 5
slow_interval: 20
permanent_ckpt_interval: null
recent_ckpt_minutes: 1000
peak_tflops: 312           # A100 bf16 dense; only feeds the MFU metric
