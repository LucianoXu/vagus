# Evict-only arm, seed 44 (branch evict-only, 2026-09-02).
# From the SAX2 15B endpoint, 2B tokens with hard eviction active
# (block streaming, budget 128 atoms/head, transported error-law score
# 'lin', hard top-k, no pool / no demotion). Paired control =
# plain_ct2B_s44 (identical everything, manage: none). Batch geometry
# 8x8 as in every tier-1 arm so the window->step mapping is identical.
# Budget 128 (not tier-1's 512): the frozen evict-only floor at 512 is
# only +0.013 nat above full; at 128 it is +0.043 (byte-fair grid), so
# there is a gap for closed-loop adaptation to close.
# lr: continued-pretraining convention, 10% of pretrain peak, short
# warmup, linear cooldown over the last 20%.

run_name: evict-ct2B-m128-s44
model_recipe: ../model/sax1_340M.yaml

init_ckpt: runs/sax2-340M-fwe15B-79629bc6/ckpt-00028610.pt
manage: evict
block_len: 256
budget: 128
ring_window: 32
score: lin
lookahead: 0
gumbel_tau: 0.0
manage_every: 1
compile_cell: true
use_checkpoint: false
holdout_last_shard: true

data_dir: data/tokenized/fineweb-edu-100BT-mistral32k
data_shards: null

context_len: 2048
world_size: 4
batch_size: 8
grad_accum_steps: 8
global_batch_tokens: 524288
train_tokens: 2_000_000_000
seed: 44

optimizer_name: muon
optimizer_args:
  lr: 1.75e-4
  momentum: 0.95
  weight_decay: 0.1
  lr_adjust: rms
  ns_coeffs: polar_express
  adamw:
    lr: 1.75e-4
    betas: [0.9, 0.95]
    weight_decay: 0.1

schedule_name: wsd
schedule_args:
  warmup: 0.04
  decay: 0.2
  min_ratio: 0.0

grad_clip: 1.0
z_loss: 1e-4
ce_impl: liger

device: auto
dtype: bfloat16
compile: false          # streaming path compiles its own cell (compile_cell)
tf32: true

out_root: runs
log_interval: 10
slow_interval: 100
permanent_ckpt_interval: 2000
recent_ckpt_minutes: 30
peak_tflops: 312
gnorm_gate: 1.1
