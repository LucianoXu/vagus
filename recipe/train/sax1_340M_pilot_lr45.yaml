# SAX1-340M lr pilot @ 4.5e-3 — the fitted law's OWN prediction for the
# 1B-token horizon (1.75e-3 * 15^0.3461), added after the first three
# arms to bracket the 1B optimum. Siblings: lr10 / lr17 / lr30.
#
# Read: if this arm is best and stable at 1B, the law's horizon exponent
# transfers to our stack and the 15B run keeps lr 1.75e-3 with high
# confidence. If it spikes or diverges, we found the recipe's stability
# ceiling. Either way the 15B lr comes from (1B optimum) / 2.55, NOT
# from promoting the best 1B arm directly.
#
# warmup 0.1 = 100M tokens, held near the main run's warmup TOKEN count
# (150M) rather than its 1% fraction, same as the sibling pilots.

run_name: sax1-340M-pilot-lr45
model_recipe: ../model/sax1_340M.yaml

data_dir: data/tokenized/fineweb-edu-100BT-mistral32k
data_shards: null

context_len: 2048
world_size: 4
batch_size: 16
grad_accum_steps: 4
global_batch_tokens: 524288
train_tokens: 1_000_000_000
seed: 42

optimizer_name: muon
optimizer_args:
  lr: 4.5e-3
  momentum: 0.95
  weight_decay: 0.1
  lr_adjust: rms
  ns_coeffs: polar_express
  adamw:
    lr: 4.5e-3
    betas: [0.9, 0.95]
    weight_decay: 0.1

schedule_name: linear
schedule_args:
  warmup: 0.1
  min_ratio: 0.05

grad_clip: 1.0
z_loss: 1e-4
ce_impl: liger

device: auto
dtype: bfloat16
compile: true
tf32: true

out_root: runs
log_interval: 10
slow_interval: 100
permanent_ckpt_interval: null    # final checkpoint only
recent_ckpt_minutes: 30
peak_tflops: 312
