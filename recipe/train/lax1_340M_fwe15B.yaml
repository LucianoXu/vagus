# LAX1-340M on FineWeb-Edu, 15B tokens — the LAX series opener, batch-
# paired against the SAX generation runs: same data, token budget, global
# batch, seed and optimizer recipe, so the delta is the mixer (Kimi Delta
# Attention vs softmax attention). COMPARE ON loss_ce.
#
# Schedule: WSD, as SAX2 (warmup 1%, flat, linear cooldown over the last
# 15% to 0) — the user's call for the long-horizon series: the stable-
# phase permanent checkpoints (every 5000 steps; decay starts at 85% =
# step 24318) are the trunk for cooldown-branch experiments, and the
# schedule shape is the one the 1.3B flagship will use. So the primary
# pair is sax2-340M-fwe15B-79629bc6 (WSD, loss_ce tail5 2.4153); the
# linear-decay reference is sax1-340M-fwe15B-74b227a9 (2.4007; SAX2
# trailed it by 0.015 nat with this short cooldown).
#
# Optimizer recipe = SAX1/SAX2's (Muon polar-express + AdamW, shared lr
# via rms adjust, z-loss 1e-4, wd 0.1), with the model's own routing:
# the low-rank gate projections and beta projection train under AdamW,
# A_log / per-channel dt_bias / norm gammas are never decayed
# (GDNLM.param_groups). lr 1.75e-3 is provisional until the
# lax1_340M_pilot_* ladder has cleared it (see those files).
#
# Expected reading (GDN paper / Kimi Linear numbers at 340M-1.4B):
# loss_ce at or slightly under the softmax pair. That parity says nothing
# about exact recall, which is where linear attention is known to lose; a
# recall probe (MQAR-style) is a separate eval, not this run.

run_name: lax1-340M-fwe15B
model_recipe: ../model/lax1_340M.yaml

data_dir: data/tokenized/fineweb-edu-100BT-mistral32k
data_shards: null          # all 20 shards (16.7B tokens); 15B => 0.9 epoch

context_len: 2048
# 4 GPUs, single node; global batch = 4 * 8 * 8 * 2048 = 0.5M tokens.
# micro 8 / accum 8 (SAX1 ran 16 / 4): KDA at micro 16 OOMs on A100-40GB
# at the first step (38 GB allocated — per-channel gates, conv/l2norm
# intermediates and the kernel's saved chunk states on top of SAX1's
# 40.1 GB-peak footprint; jobs 30066917/18). The loader assigns each
# optimizer step the same global window set for 8x8 and 16x4 (rank-
# interleaved slices of the shuffled order), so the SAX1 batch pairing
# holds; only the micro-batch partition of each step differs.
world_size: 4
batch_size: 8              # per-rank micro-batch
grad_accum_steps: 8
global_batch_tokens: 524288
train_tokens: 15_000_000_000
seed: 42

optimizer_name: muon
optimizer_args:
  lr: 1.75e-3
  momentum: 0.95
  weight_decay: 0.1
  lr_adjust: rms
  ns_coeffs: polar_express
  adamw:
    lr: 1.75e-3
    betas: [0.9, 0.95]
    weight_decay: 0.1

schedule_name: wsd
schedule_args:
  warmup: 0.01             # 150M tokens, same as SAX1/SAX2
  decay: 0.15              # linear cooldown over the last 2.25B tokens (SAX2)
  min_ratio: 0.0

grad_clip: 1.0
z_loss: 1e-4
ce_impl: liger

device: auto
dtype: bfloat16
compile: true
tf32: true

out_root: runs
log_interval: 10
slow_interval: 100
permanent_ckpt_interval: 5000
recent_ckpt_minutes: 30
peak_tflops: 312           # A100 bf16 dense; only feeds the MFU metric
