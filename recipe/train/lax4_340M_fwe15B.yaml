# LAX4-340M on FineWeb-Edu, 15B tokens — the Diagonal KDN arm, the last
# untested variant of the Kalman write (see the model recipe). Paired
# with LAX1 and LAX2 exactly as LAX2 was paired with LAX1: same data,
# budget, global batch, seed, optimizer and layout.
#
# COMPARE first on write_selectivity, not loss. LAX1 corr(w, rho)
# -0.0320 / write gain 0.9910; LAX2 -0.0177 / 0.9938. If LAX4 does not
# move those, the Kalman parameterisation does not deliver selectivity at
# this scale in either approximation and the line is closed.
#
# Throughput is the open risk: the asymmetric write has no fla kernel, so
# this runs the torch chunkwise form with a gradient-checkpointed chunk
# body. LAX1 ran at 150.8k tok/s and LAX2 at 128.2k; if LAX4 lands far
# below that, 15B stops being affordable and the arm should be cut to a
# shorter budget rather than run half.

run_name: lax4-340M-fwe15B
model_recipe: ../model/lax4_340M.yaml

data_dir: data/tokenized/fineweb-edu-100BT-mistral32k
data_shards: null          # all 20 shards (16.7B tokens); 15B => 0.9 epoch

context_len: 2048
# 4 GPUs, single node; global batch = 4 * 8 * 8 * 2048 = 0.5M tokens.
# micro 8 / accum 8 (SAX1 ran 16 / 4): KDA at micro 16 OOMs on A100-40GB
# at the first step (38 GB allocated — per-channel gates, conv/l2norm
# intermediates and the kernel's saved chunk states on top of SAX1's
# 40.1 GB-peak footprint; jobs 30066917/18). The loader assigns each
# optimizer step the same global window set for 8x8 and 16x4 (rank-
# interleaved slices of the shuffled order), so the SAX1 batch pairing
# holds; only the micro-batch partition of each step differs.
world_size: 4
batch_size: 8              # per-rank micro-batch
grad_accum_steps: 8
global_batch_tokens: 524288
train_tokens: 15_000_000_000
seed: 42

optimizer_name: muon
optimizer_args:
  lr: 1.75e-3
  momentum: 0.95
  weight_decay: 0.1
  lr_adjust: rms
  ns_coeffs: polar_express
  adamw:
    lr: 1.75e-3
    betas: [0.9, 0.95]
    weight_decay: 0.1

schedule_name: wsd
schedule_args:
  warmup: 0.01             # 150M tokens, same as SAX1/SAX2
  decay: 0.15              # linear cooldown over the last 2.25B tokens (SAX2)
  min_ratio: 0.0

grad_clip: 1.0
z_loss: 1e-4
ce_impl: liger

device: auto
dtype: bfloat16
compile: true
tf32: true

out_root: runs
log_interval: 10
slow_interval: 100
permanent_ckpt_interval: 5000
recent_ckpt_minutes: 30
peak_tflops: 312           # A100 bf16 dense; only feeds the MFU metric
