# LAX2-340M on FineWeb-Edu, 15B tokens — the write-rule arm of the LAX
# series: LAX1's model with the delta rule's beta replaced by an
# Isotropic Kalman gain (see the model recipe for the mechanism and for
# the measurement on LAX1 that motivates it). Batch-paired with LAX1 and
# with the SAX2 / HAX1 15B runs: same data, token budget, global batch,
# seed, optimizer recipe and layout, so the delta is the write rule and
# nothing else. +0.029% params.
#
# COMPARE ON loss_ce against lax1-340M-fwe15B-c9af2f44 (tail5 2.3956),
# the direct pair. Series context: sax2-340M-fwe15B-79629bc6 (2.4153),
# hax1-340M-fwe15B. Upstream reports a ~0.36 WikiText PPL gain over KDA
# at 1.3B/100B, so at this scale the LM-loss effect may sit inside our
# run-to-run noise; the recall probe and the write-selectivity probe are
# the reads that decide the arm (model recipe, "What decides it").
#
# Layout: LAX1's exactly — world 4 = 1 node x 4 A100 DDP, micro 8 x
# accum 8, global batch 0.5M tokens, Muon polar-express + AdamW at a
# shared lr 1.75e-3 (rms adjust), WSD (warmup 1%, flat, cooldown over
# the last 15%), z-loss 1e-4, wd 0.1. No pilot ladder: the mixer's width
# and depth are unchanged, so the LAX1 ladder's 1.75e-3 carries over.
#
# Before the main run, smoke it. The Kalman gain replaces a sigmoid with
# a ratio of accumulating quantities, so the two things to watch are the
# gate probe's beta (it should NOT sit pinned near 1 the way LAX1's does)
# and simple numerical health — the uncertainty scan is a prefix product
# of 2x2 matrices, renormalised, but it runs in bf16 autocast around an
# fp32 core for the first time here.

run_name: lax2-340M-fwe15B
model_recipe: ../model/lax2_340M.yaml

data_dir: data/tokenized/fineweb-edu-100BT-mistral32k
data_shards: null          # all 20 shards (16.7B tokens); 15B => 0.9 epoch

context_len: 2048
# 4 GPUs, single node; global batch = 4 * 8 * 8 * 2048 = 0.5M tokens.
# micro 8 / accum 8 (SAX1 ran 16 / 4): KDA at micro 16 OOMs on A100-40GB
# at the first step (38 GB allocated — per-channel gates, conv/l2norm
# intermediates and the kernel's saved chunk states on top of SAX1's
# 40.1 GB-peak footprint; jobs 30066917/18). The loader assigns each
# optimizer step the same global window set for 8x8 and 16x4 (rank-
# interleaved slices of the shuffled order), so the SAX1 batch pairing
# holds; only the micro-batch partition of each step differs.
world_size: 4
batch_size: 8              # per-rank micro-batch
grad_accum_steps: 8
global_batch_tokens: 524288
train_tokens: 15_000_000_000
seed: 42

optimizer_name: muon
optimizer_args:
  lr: 1.75e-3
  momentum: 0.95
  weight_decay: 0.1
  lr_adjust: rms
  ns_coeffs: polar_express
  adamw:
    lr: 1.75e-3
    betas: [0.9, 0.95]
    weight_decay: 0.1

schedule_name: wsd
schedule_args:
  warmup: 0.01             # 150M tokens, same as SAX1/SAX2
  decay: 0.15              # linear cooldown over the last 2.25B tokens (SAX2)
  min_ratio: 0.0

grad_clip: 1.0
z_loss: 1e-4
ce_impl: liger

device: auto
dtype: bfloat16
compile: true
tf32: true

out_root: runs
log_interval: 10
slow_interval: 100
permanent_ckpt_interval: 5000
recent_ckpt_minutes: 30
peak_tflops: 312           # A100 bf16 dense; only feeds the MFU metric
