# LAX2 (Isotropic KDN, LAX1 byte-for-byte with a Kalman gain in beta's
# place; beta ~0.5 half-writes, recall 3x worse than LAX1, loss parity)
# through the one-hop consolidation unit test at the phase-A operating
# point, same items as LAX1 (seed 0): does a memory written at half
# strength consolidate differently? Compare with
# consolidate-gap256-lr5e-5-mix0-rk0.5 (LAX1, ratio 0.165).

eval_name: consolidate-gap256-lax2-onehop-340M
subjects:
  - {ckpt: runs/gen-eval/lax2-model-final.pt, label: LAX2, run_meta: runs/cmp/lax2/meta.json}

device: auto
dtype: bfloat16
seed: 0

tasks:
  - name: consolidation
    args:
      data_dir: data/tokenized/fineweb-edu-100BT-mistral32k
      n_items: 32
      x_len: [2048]
      y_len: 512
      gap: 256
      batch_size: 2
      buckets: [64, 256]
      method: replay_kl
      sleep_x_len: [2048]
      sleep:
        n_samples: 32
        sample_len: 256
        temperature: 1.0
        sample_batch: 32
        steps: 64
        lr: 5e-5
        batch: 8
        lm_mix: 0.0
        retain_kl: 0.5
        lm_batch: 4
        lm_len: 512
        retain_windows: 8

out_root: runs/eval
registry_dir: registry/eval
