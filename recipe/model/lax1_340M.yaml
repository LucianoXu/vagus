# LAX1-340M — opener of the LAX series: frontier-design tracking for
# linear-attention LLMs, the counterpart of SAX for softmax attention.
# Architecture: Gated DeltaNet (arXiv:2412.06464) — scalar forget gate
# + delta-rule write — on the Transformer++ skeleton, pure (no softmax
# layers, no positional encoding). Paired against SAX1-340M: same 24 x
# 1024 coordinate, tied embedding, same FFN, same data/recipe, so the
# loss delta is attributable to the mixer.
#
# Mixer layout (GLA's parameter-matching trick): 4 heads, key head 128,
# value head 256, i.e. q/k project to d/2 and v/gate/o to d. The mixer is
# then 4 d^2 params like MHA, and the whole model lands at 341.5M vs
# SAX1's 341.1M (+0.12%) with the FFN untouched. Small heads are the
# wrong economy here: per-head memory is a dk x dv matrix, so 16 heads
# of 64 would quarter the state at equal params.
#
# Considered and NOT taken (2026-09-07):
#   expand_v 2 (fla default, value head 2x key head at 8 heads): +30%
#     params, leaves the coordinate.
#   8 heads of 128/128: +7.6% params; state size equal, more heads —
#     an ablation candidate at pilot scale, not the anchor.
#   hybrid (softmax every 4th layer): the known fix for the exact-recall
#     gap; separate LAX entry so the pure number exists first.
#   vector (per-channel) gate (GLA/KDA): not implemented yet; the module
#     covers GDN / DeltaNet / SSD-style / plain via gate+delta flags.

model_name: GDNLM
model_args:
  vocab_size: 32000        # mistral32k tokenizer
  dim: 1024
  layer_count: 24
  head_count: 4
  key_head_dim: 128
  value_head_dim: 256
  ffn_hidden_dim: 2816     # same as SAX1
  short_conv_size: 4       # causal depthwise conv on q/k/v (GDN ablation: essential)
  gate: true               # scalar forget gate (Mamba2 dt/A parameterisation)
  delta: true              # delta-rule write
  chunk_size: 64
  la_impl: auto            # fla kernels on cuda/bf16, torch chunk reference elsewhere
  layer_pattern: gdn       # pure; 'gdn,gdn,gdn,softmax' for a hybrid
  context_len: 2048        # only binds softmax layers (RoPE); pure GDN has no limit
  rmsnorm_eps: 1.0e-6
  tie_embedding: true
  gate_proj_optimizer: adamw   # the d x H gate matrices train under AdamW, not Muon
